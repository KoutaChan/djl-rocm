name: build-rocm-jni

on:
  workflow_dispatch:
  push:
    tags:
      - "rocm-*"

permissions:
  contents: write

jobs:
  engine:
    name: pack pytorch-engine (patched)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Publish pytorch-engine to local m2
        run: |
          ./gradlew :engines:pytorch:pytorch-engine:publishToMavenLocal -x test

      - name: Pack m2 tree
        run: |
          mkdir -p out
          cd ~/.m2/repository
          tar czf "$GITHUB_WORKSPACE/out/pytorch-engine-patched.tar.gz" \
              ai/djl/pytorch/pytorch-engine

      - uses: actions/upload-artifact@v4
        with:
          name: pytorch-engine-patched
          path: out/pytorch-engine-patched.tar.gz
          retention-days: 30

  jni:
    name: build ${{ matrix.rocm }} (pytorch ${{ matrix.pt }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyTorch versions reflect what is actually published under
          # https://download.pytorch.org/libtorch/<flavor>/ for each ROCm.
          # Compatibility against DJL 0.37 JNI verified via PyTorch 2.7-2.11
          # release notes (deprecation warnings only from 2.10 onwards).
          - rocm: rocm6.3
            pt: "2.9.1"
            image: rocm/dev-ubuntu-22.04:6.3-complete
          - rocm: rocm6.4
            pt: "2.9.1"
            image: rocm/dev-ubuntu-22.04:6.4-complete
          - rocm: rocm7.0
            pt: "2.10.0"
            image: rocm/dev-ubuntu-24.04:7.0-complete
          - rocm: rocm7.1
            pt: "2.11.0"
            image: rocm/dev-ubuntu-24.04:7.1-complete
          - rocm: rocm7.2
            pt: "2.11.0"
            image: rocm/dev-ubuntu-24.04:7.2-complete
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl unzip cmake g++ ca-certificates openjdk-21-jdk-headless
          update-ca-certificates

      - uses: actions/checkout@v4

      - name: Build libdjl_torch.so
        working-directory: engines/pytorch/pytorch-native
        run: ./build.sh ${{ matrix.pt }} ${{ matrix.rocm }} cxx11 amd64

      - name: Verify JNI built
        run: test -f engines/pytorch/pytorch-native/build/libdjl_torch.so

      - name: Publish pytorch-jni-${{ matrix.rocm }} to local m2
        run: |
          ./gradlew :engines:pytorch:pytorch-jni-rocm:publishToMavenLocal \
            -Ppt_version=${{ matrix.pt }} -Procm_flavor=${{ matrix.rocm }} -x test

      - name: Pack m2 tree
        run: |
          mkdir -p out
          cd ~/.m2/repository
          tar czf "$GITHUB_WORKSPACE/out/pytorch-jni-${{ matrix.rocm }}.tar.gz" \
              ai/djl/pytorch/pytorch-jni-${{ matrix.rocm }}

      - uses: actions/upload-artifact@v4
        with:
          name: pytorch-jni-${{ matrix.rocm }}
          path: out/pytorch-jni-${{ matrix.rocm }}.tar.gz
          retention-days: 30

  release:
    name: attach tarballs to release
    if: startsWith(github.ref, 'refs/tags/rocm-')
    needs: [engine, jni]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
