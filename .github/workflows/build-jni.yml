name: Build JNI

on:
  workflow_dispatch:
  push:
    tags:
      - "jni-*"
      - "rocm-*"

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin

jobs:
  engine:
    name: Publish API + PyTorch Engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Publish api + pytorch-engine to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :api:publish :engines:pytorch:pytorch-engine:publish \
              -Pgithub -PgithubRepo=${{ github.repository }} -x test

  # Linux x86_64, ROCm flavors (via rocm/dev-ubuntu-*-complete container).
  # Each ROCm version is paired with the latest PyTorch libtorch published
  # for it on pytorch.org: rocm6.4->2.9.1, rocm7.0->2.10.0, rocm7.1/7.2->2.11.0.
  jni-rocm:
    name: Build ${{ matrix.flavor }} (PyTorch ${{ matrix.pt }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: rocm6.4
            pt: "2.9.1"
            image: rocm/dev-ubuntu-22.04:6.4-complete
          - flavor: rocm7.0
            pt: "2.10.0"
            image: rocm/dev-ubuntu-24.04:7.0-complete
          - flavor: rocm7.1
            pt: "2.11.0"
            image: rocm/dev-ubuntu-24.04:7.1-complete
          - flavor: rocm7.2
            pt: "2.11.0"
            image: rocm/dev-ubuntu-24.04:7.2-complete
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Prepare libtorch mount
        run: |
          LIBTORCH_MOUNT="${RUNNER_TEMP}/libtorch-${{ matrix.flavor }}"
          rm -rf "${LIBTORCH_MOUNT}"
          install -d -m 0777 "${LIBTORCH_MOUNT}"
          echo "LIBTORCH_MOUNT=${LIBTORCH_MOUNT}" >> "${GITHUB_ENV}"

      - name: Build and publish pytorch-jni-${{ matrix.flavor }}
        env:
          PT_VERSION: ${{ matrix.pt }}
          FLAVOR: ${{ matrix.flavor }}
          CLASSIFIER: linux-x86_64
          IMAGE: ${{ matrix.image }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
              -e PT_VERSION -e FLAVOR -e CLASSIFIER \
              -e HOST_UID -e HOST_GID \
              -e GITHUB_ACTOR -e GITHUB_TOKEN -e GITHUB_REPOSITORY \
              -v "$GITHUB_WORKSPACE:/ws" \
              -v "$LIBTORCH_MOUNT:/ws/engines/pytorch/pytorch-native/libtorch" \
              -w /ws \
              "$IMAGE" \
              bash .github/workflows/scripts/build-in-container.sh

  # Linux x86_64, CPU and CUDA flavors (runner native, CUDA apt packages).
  jni-linux:
    name: Build ${{ matrix.flavor }} (PyTorch ${{ matrix.pt }}, linux)
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            pt: "2.11.0"
            cuda: ""
          - flavor: cu128
            pt: "2.11.0"
            cuda: "12.8.1"
          - flavor: cu129
            pt: "2.11.0"
            cuda: "12.9.1"
          - flavor: cu130
            pt: "2.11.0"
            cuda: "13.0.0"
    steps:
      # cuda-toolkit-X-Y (~7 GB) + libtorch (~4 GB) + gradle cache overwhelm
      # ubuntu-22.04's ~29 GB default free space and the runner eventually
      # aborts with ENOSPC writing its own log. Reclaim ~20 GB before the
      # cuda install step kicks in.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              git curl unzip cmake g++ make ca-certificates

      # Install CUDA directly via NVIDIA's apt repo. We used to go through
      # Jimver/cuda-toolkit, but:
      #   - network install hit the "libcublas-dev-X-Y vs cuda-cublas-dev"
      #     rename churn and the cuda 13 nvrtc split;
      #   - local install on cuda 13 hits a runfile bug where the bundled
      #     cuda_cccl/.../nv/detail/__preprocessor (actually a dir) is
      #     copied as a file and the installer aborts.
      # apt sidesteps both; cuda-toolkit-X-Y is a meta-package that pulls
      # in nvcc + cudart + all the math libs + nvrtc with matching names.
      - name: Install CUDA ${{ matrix.cuda }}
        if: matrix.cuda != ''
        env:
          CUDA: ${{ matrix.cuda }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          # Derive apt suffix from flavor: cu128 -> 12-8, cu129 -> 12-9, cu130 -> 13-0.
          CU=${FLAVOR#cu}
          MAJOR=$((CU / 10))
          MINOR=$((CU % 10))
          SUFFIX="${MAJOR}-${MINOR}"
          DISTRO=ubuntu2204
          curl -fsSLo cuda-keyring_1.1-1_all.deb \
              "https://developer.download.nvidia.com/compute/cuda/repos/${DISTRO}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          rm -f cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "cuda-toolkit-${SUFFIX}"
          sudo apt-get install -y --no-install-recommends libnccl-dev \
              || echo "libnccl-dev is unavailable; native distributed training will use fallback stubs"
          echo "CUDA_HOME=/usr/local/cuda-${MAJOR}.${MINOR}" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-${MAJOR}.${MINOR}/bin" >> "$GITHUB_PATH"

      - name: Build libdjl_torch.so
        working-directory: engines/pytorch/pytorch-native
        run: ./build.sh ${{ matrix.pt }} ${{ matrix.flavor }} cxx11 amd64

      - name: Publish pytorch-jni-${{ matrix.flavor }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :engines:pytorch:pytorch-jni-rocm:publish \
              -Ppt_version=${{ matrix.pt }} \
              -Pflavor=${{ matrix.flavor }} \
              -Pclassifier=linux-x86_64 \
              -Pgithub -PgithubRepo=${{ github.repository }} -x test

  # Windows x86_64, CPU and CUDA flavors (windows-latest + build.cmd).
  # pytorch.org stopped publishing Windows libtorch cu129 after 2.8.0, so
  # the Windows matrix intentionally skips cu129 (Linux still covers it).
  # A physical NVIDIA GPU is not required; these jobs compile the JNI library
  # against the CUDA toolkit and do not run GPU runtime tests.
  jni-windows:
    name: Build ${{ matrix.flavor }} (PyTorch ${{ matrix.pt }}, win)
    runs-on: [self-hosted, djl-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            pt: "2.11.0"
            cuda: ""
          - flavor: cu128
            pt: "2.11.0"
            cuda: "12.8.1"
            cuda_components: '["cuda_cccl", "cuda_cudart", "cuda_nvcc", "cuda_nvrtc", "cuda_nvtx", "libcublas", "libcurand", "libcufft", "libcusparse", "libcusolver", "libnvjitlink"]'
          - flavor: cu130
            pt: "2.11.0"
            cuda: "13.0.0"
            cuda_components: '["cuda_cccl", "cuda_crt", "cuda_cudart", "cuda_nvcc", "cuda_nvrtc", "cuda_nvtx", "libcublas", "libcurand", "libcufft", "libcusparse", "libcusolver", "libnvjitlink", "libnvptxcompiler", "libnvvm"]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: lukka/get-cmake@latest
        with:
          ninjaVersion: latest
          useLocalCache: true

      # Use NVIDIA's redistrib zip archives instead of the Windows installer.
      # The installer needs to execute a downloaded .exe from the runner tool
      # cache, which fails with EACCES on this self-hosted runner. The zip
      # archives extract into a normal CUDA root and do not require admin.
      - name: Install CUDA ${{ matrix.cuda }}
        if: matrix.cuda != ''
        shell: pwsh
        env:
          CUDA_COMPONENTS: ${{ matrix.cuda_components }}
        run: |
          .\.github\workflows\scripts\install-cuda-redist.ps1 `
              -CudaVersion "${{ matrix.cuda }}" `
              -ComponentsJson "$env:CUDA_COMPONENTS"

      - name: Build djl_torch.dll
        working-directory: engines/pytorch/pytorch-native
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          if not "${{ matrix.cuda }}" == "" (
            set "CMAKE_GENERATOR=Ninja"
            set "CUDACXX=%CUDA_PATH%\bin\nvcc.exe"
          )
          build.cmd ${{ matrix.pt }} ${{ matrix.flavor }}

      - name: Publish pytorch-jni-${{ matrix.flavor }}
        shell: cmd
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          call gradlew.bat :engines:pytorch:pytorch-jni-rocm:publish ^
              -Ppt_version=${{ matrix.pt }} ^
              -Pflavor=${{ matrix.flavor }} ^
              -Pclassifier=win-x86_64 ^
              -Pgithub -PgithubRepo=${{ github.repository }} -x test

  # macOS arm64 only, CPU. Intel macOS was dropped from the matrix because
  # pytorch.org stopped shipping libtorch-macos-x86_64 after 2.2.x and the
  # GitHub Actions macos-13 runner pool is now heavily queued, so the job
  # would routinely hang indefinitely waiting for a host.
  jni-macos:
    name: Build cpu (PyTorch ${{ matrix.pt }}, ${{ matrix.classifier }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: osx-aarch64
            runner: macos-14
            pt: "2.11.0"
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install build tools
        run: brew install cmake

      - name: Build libdjl_torch.dylib
        working-directory: engines/pytorch/pytorch-native
        run: ./build.sh ${{ matrix.pt }} cpu cxx11 ${{ matrix.arch }}

      - name: Publish pytorch-jni-cpu (${{ matrix.classifier }})
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :engines:pytorch:pytorch-jni-rocm:publish \
              -Ppt_version=${{ matrix.pt }} \
              -Pflavor=cpu \
              -Pclassifier=${{ matrix.classifier }} \
              -Pgithub -PgithubRepo=${{ github.repository }} -x test
